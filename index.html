<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReMeal – Có gì trong tủ?</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .handwrite { font-family: 'Comic Sans MS', 'Segoe Print', cursive; }
  .hero {
    height: 100vh;
    min-height: 100vh;
    max-height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse 55% 60% at 8% 15%, rgba(196,224,150,0.55) 0%, rgba(196,224,150,0) 60%),
      radial-gradient(ellipse 45% 55% at 4% 90%, rgba(214,232,150,0.5) 0%, rgba(214,232,150,0) 60%),
      radial-gradient(ellipse 50% 55% at 96% 10%, rgba(200,228,180,0.45) 0%, rgba(200,228,180,0) 60%),
      radial-gradient(ellipse 55% 60% at 98% 90%, rgba(190,222,160,0.5) 0%, rgba(190,222,160,0) 60%),
      linear-gradient(180deg, #fbfdf6 0%, #f8faf1 100%);
  }
  .glow-left {
    position:absolute; left:-8%; bottom:-10%; width:45%; height:70%;
    background: radial-gradient(circle, rgba(150,210,110,0.35) 0%, rgba(150,210,110,0) 70%);
    filter: blur(20px); pointer-events:none;
  }
  .glow-right {
    position:absolute; right:-6%; top:0; width:40%; height:100%;
    background: radial-gradient(circle, rgba(180,220,150,0.3) 0%, rgba(180,220,150,0) 70%);
    filter: blur(20px); pointer-events:none;
  }
  .decor { position:absolute; pointer-events:none; }
  .card {
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background: rgba(255,255,255,0.7); backdrop-filter: blur(2px);
    border:1px solid rgba(190,224,190,0.7);
    border-radius:24px;
    box-shadow: 0 8px 20px -8px rgba(47,107,58,0.25);
    width:140px; height:155px; padding:14px;
  }
  @media (min-width:1280px){ .card{ width:175px; height:190px; } }
  .icon-circle {
    width:44px; height:44px; border-radius:9999px; background:#dcefdc;
    display:flex; align-items:center; justify-content:center; margin-bottom:8px;
  }
  @media (min-width:768px){ .icon-circle{ width:48px; height:48px; } }
  .cta-btn {
    display:flex; align-items:center; justify-content:space-between;
    border-radius:9999px; font-weight:800; color:#fff;
    background: linear-gradient(135deg, #4c9a52 0%, #2c6a37 100%);
    padding:12px 8px 12px 26px;
    width: clamp(240px, 22vw, 340px);
    height: clamp(56px, 5.5vw, 74px);
    font-size: clamp(15px, 1.4vw, 19px);
    box-shadow: 0 8px 18px -6px rgba(44,106,55,0.45);
    transition: box-shadow .25s ease, transform .25s ease;
    border:none; cursor:pointer;
  }
  .cta-btn:hover {
    box-shadow: 0 14px 26px -8px rgba(44,106,55,0.55);
    transform: translateY(-3px);
  }
  .cta-circle {
    width: clamp(34px, 3vw, 44px); height: clamp(34px, 3vw, 44px);
    background:#fff; border-radius:9999px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .25s ease;
  }
  .cta-btn:hover .cta-circle { transform: translateX(4px); }
  .food-section {
    position: absolute;
    top: 0;
    right: 0;
    width: 30%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    gap: -200px;
    transform: translateX(-130px);
    z-index: 4;
  }
  .food-item {
    width: clamp(210px, 19vw, 300px);
    height: auto;
    object-fit: contain;
  }
  .mascot-wrap {
    position: absolute;
    left: -200px;
    top: 50px;
    width: 34%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    z-index: 10;
    pointer-events: none;
  }
  .mascot-wrap img {
    height: 88vh;
    width: auto;
    max-width: none;
    object-fit: contain;
    margin-left: -10px;
  }

  @keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
  50% { transform: translateY(-60px) rotate(10deg); opacity: 0.8; }
}

.floating-ingredient {
  position: fixed;
  width: 60px;
  height: 60px;
  object-fit: contain;
  opacity: 0.5;
  pointer-events: none;
  z-index: 1;
  animation: float 6s infinite ease-in-out;
}

.floating-ingredient:nth-child(1) { bottom: 20%; left: 5%; animation-delay: 0s; }
.floating-ingredient:nth-child(2) { bottom: 40%; left: 12%; animation-delay: 1s; }
.floating-ingredient:nth-child(3) { bottom: 15%; right: 8%; animation-delay: 2s; }
.floating-ingredient:nth-child(4) { bottom: 35%; right: 15%; animation-delay: 1.5s; }
.floating-ingredient:nth-child(5) { bottom: 55%; left: 8%; animation-delay: 2.5s; }
.floating-ingredient:nth-child(6) { bottom: 50%; right: 5%; animation-delay: 0.5s; }
.floating-ingredient:nth-child(7) { bottom: 25%; left: 20%; animation-delay: 3s; }
.floating-ingredient:nth-child(8) { bottom: 60%; right: 20%; animation-delay: 1.8s; }
.floating-ingredient:nth-child(9) { bottom: 30%; right: 25%; animation-delay: 2.2s; }
  
</style>
</head>
<body class="bg-white">

  <!-- Floating ingredients background -->
<div style="position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 1; overflow: hidden;">
  <!-- Set 1 -->
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/broccoli.png" alt="" class="floating-ingredient" style="bottom: 20%; left: 5%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/chilli.webp" alt="" class="floating-ingredient" style="bottom: 40%; left: 12%;" />

  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/igdi%202.webp" alt="" class="floating-ingredient" style="bottom: 55%; left: 8%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/igdi.jpg" alt="" class="floating-ingredient" style="bottom: 50%; right: 5%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/leaf.png" alt="" class="floating-ingredient" style="bottom: 25%; left: 20%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/onion.webp" alt="" class="floating-ingredient" style="bottom: 60%; right: 20%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/tomato%201.png" alt="" class="floating-ingredient" style="bottom: 30%; right: 25%;" />
  
  <!-- Set 2 - Nguyên liệu mới -->
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/avocado.webp" alt="" class="floating-ingredient" style="bottom: 45%; left: 15%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/chives.webp" alt="" class="floating-ingredient" style="bottom: 22%; left: 30%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%202.png" alt="" class="floating-ingredient" style="bottom: 70%; left: 25%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%203.webp" alt="" class="floating-ingredient" style="bottom: 18%; right: 30%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%204.webp" alt="" class="floating-ingredient" style="bottom: 65%; right: 10%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%205.webp" alt="" class="floating-ingredient" style="bottom: 35%; left: 2%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%206.webp" alt="" class="floating-ingredient" style="bottom: 55%; right: 35%;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%207.webp" alt="" class="floating-ingredient" style="bottom: 10%; left: 40%;" />
  
  <!-- Set 3 - Lặp lại để nhân 3 -->
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/broccoli.png" alt="" class="floating-ingredient" style="bottom: 38%; left: 45%; animation-delay: 0.3s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/chilli.webp" alt="" class="floating-ingredient" style="bottom: 52%; left: 8%; animation-delay: 0.6s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/egg.webp" alt="" class="floating-ingredient" style="bottom: 28%; right: 42%; animation-delay: 0.9s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/avocado.webp" alt="" class="floating-ingredient" style="bottom: 48%; right: 28%; animation-delay: 1.2s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/chives.webp" alt="" class="floating-ingredient" style="bottom: 75%; left: 50%; animation-delay: 1.5s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%202.png" alt="" class="floating-ingredient" style="bottom: 12%; right: 50%; animation-delay: 1.8s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%203.webp" alt="" class="floating-ingredient" style="bottom: 62%; left: 60%; animation-delay: 2.1s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%204.webp" alt="" class="floating-ingredient" style="bottom: 32%; left: 70%; animation-delay: 2.4s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%205.webp" alt="" class="floating-ingredient" style="bottom: 58%; right: 60%; animation-delay: 2.7s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%206.webp" alt="" class="floating-ingredient" style="bottom: 20%; left: 80%; animation-delay: 3s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/inge%207.webp" alt="" class="floating-ingredient" style="bottom: 68%; right: 3%; animation-delay: 3.3s;" />
  <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/tomato%201.png" alt="" class="floating-ingredient" style="bottom: 42%; left: 35%; animation-delay: 3.6s;" />
</div>

<div class="hero relative w-full overflow-hidden select-none">

  <!-- ambient glows -->
  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <!-- ===== LOGO TOP LEFT ===== -->
  <div class="absolute z-20" style="top:3%; left:3%;">
    <div class="relative inline-block">
      <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/leaf.png" alt="" class="absolute w-5 md:w-6" style="top:-12px; left:4px; transform:rotate(-10deg);" />
      <h1 class="font-extrabold leading-none" style="font-size:clamp(22px,3vw,40px); color:#2c6a37; letter-spacing:-0.5px;">ReMeal</h1>
      <svg class="mt-0.5" width="70" height="10" viewBox="0 0 70 10" fill="none">
        <path d="M2 3C15 9 25 9 35 4C45 -1 55 -1 68 5" stroke="#3f7d4a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sticky note near mascot -->

    <p class="handwrite font-bold" style="color:#3f7d4a; font-size:clamp(11px,1vw,14px); line-height:1.35;">
      Ăn ngon hơn<br />Sống xanh hơn<br />Tiết kiệm hơn
    </p>
    <svg class="mt-1" width="60" height="8" viewBox="0 0 60 8" fill="none">
      <path d="M2 4C15 8 25 1 35 5C45 8 52 3 58 5" stroke="#3f7d4a" stroke-width="1.5" stroke-linecap="round" />
    </svg>
  </div>

  <!-- ===== THREE DISHES RIGHT SIDE ===== -->
  <div class="food-section">
    <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/m%C3%B3n%20%C4%83n%201.png" alt="Món ăn 1"
         class="food-item" style="filter:drop-shadow(0 18px 20px rgba(40,90,45,0.25)); margin-right:-2%; transform: translateX(20%); transform: translateY(80px)" />
    <img src="https://raw.githubusercontent.com/k632414410088-byte/remeal/main/m%C3%B3n%20%C4%83n%202.png" alt="Món ăn 2"
         class="food-item" style="filter:drop-shadow(0 18px 20px rgba(40,90,45,0.25)); margin-right:-2%; transform: translateX(20%);" />

         class="food-item" style="filter:drop-shadow(0 18px 20px rgba(40,90,45,0.25)); margin-right:-2%; transform: translateX(20%); transform: translateY(-80px)" />
  </div>

  <!-- ===== CENTER CONTENT ===== -->
  <div class="absolute z-30 flex flex-col items-center text-center" style="top:60px; left:50%; transform:translateX(-50%); width:min(650px,48vw);">

    <div class="relative">
      <svg class="absolute" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3f7d4a" stroke-width="2" style="top:-12px; left:-32px; opacity:0.7;">
