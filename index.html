<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReMeal — Biến đồ ăn có sẵn thành bữa ăn tuyệt vời</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#155724;
    --green-800:#1c6e2e;
    --green-700:#218a38;
    --green-600:#2fa347;
    --green-500:#42b656;
    --green-100:#eaf6df;
    --green-50:#f6fbef;
    --cream:#fffdf6;
    --ink:#1c3d1f;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:'Be Vietnam Pro', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 92%, #d7ecc2 0%, transparent 45%),
      radial-gradient(circle at 90% 6%, #e3f3d3 0%, transparent 40%),
      linear-gradient(135deg, var(--green-50) 0%, var(--cream) 55%, var(--green-50) 100%);
    overflow:hidden;
    height:100vh;
    width:100vw;
  }

  .hero{
    position:relative;
    height:100vh;
    max-width:1600px;
    margin:0 auto;
    padding:2.2vh 3.2vw 2vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* decorative produce scattered at the edges */
  .veg{
    position:absolute;
    pointer-events:none;
    filter:drop-shadow(0 8px 14px rgba(20,60,20,0.14));
    z-index:1;
  }
  .veg svg{ width:100%; height:100%; display:block; }
  .veg.v1{ width:82px; top:14px;  right:36px;  transform:rotate(12deg); }
  .veg.v2{ width:54px; top:78px;  right:132px; transform:rotate(-16deg); }
  .veg.v3{ width:66px; top:44%;   right:-14px; transform:rotate(10deg); }
  .veg.v4{ width:66px; bottom:56px; right:18px;  transform:rotate(-12deg); }
  .veg.v5{ width:56px; bottom:6px;  right:112px; transform:rotate(14deg); }
  .veg.v6{ width:70px; bottom:36px; left:6px;   transform:rotate(-22deg); }
  .veg.v7{ width:58px; bottom:104px; left:66px;  transform:rotate(16deg); }
  .veg.v8{ width:82px; bottom:-12px; left:96px;  transform:rotate(-10deg); }
  .veg.v9{ width:48px; bottom:128px; left:14px;  transform:rotate(20deg); }

  /* header / logo */
  .logo-row{
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
    z-index:5;
  }
  .logo-icon{
    width:56px; height:56px;
    border-radius:50%;
    background:linear-gradient(160deg, var(--green-500), var(--green-700));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px rgba(33,138,56,0.28);
    flex-shrink:0;
  }
  .logo-icon svg{width:30px;height:30px;}
  .logo-text{line-height:1.15;}
  .logo-text .name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:28px;
    color:var(--green-800);
  }
  .logo-text .tagline{
    font-size:13.5px;
    font-weight:500;
    color:#4d6b4f;
    max-width:220px;
  }

  /* main content grid */
  .content{
    position:relative;
    z-index:5;
    display:grid;
    grid-template-columns:1.5fr 1.05fr 0.85fr;
    align-items:center;
    gap:10px;
    flex:1;
    min-height:0;
  }

  /* mascot column */
  .mascot-col{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    height:100%;
    min-width:0;
  }
  .mascot-col img{
    width:100%;
    max-width:760px;
    max-height:86vh;
    object-fit:contain;
    filter:drop-shadow(0 22px 26px rgba(28,110,46,0.20));
    animation:float 4.5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0);}
    50%{ transform:translateY(-12px);}
  }
  .heart{
    position:absolute;
    color:#ff9db3;
    opacity:0.85;
  }
  .heart.h1{ top:8%; left:2%; font-size:34px; transform:rotate(-8deg);}
  .heart.h2{ top:26%; right:6%; font-size:22px; transform:rotate(10deg);}
  .sticky-note{
    position:absolute;
    left:6%;
    bottom:2%;
    width:190px;
    background:#fbe98f;
    padding:16px 18px;
    border-radius:4px 20px 4px 20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.14), inset 0 0 0 1px rgba(0,0,0,0.03);
    transform:rotate(-7deg);
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:16px;
    line-height:1.35;
    color:#6b5410;
  }
  .sticky-note::before{
    content:"";
    position:absolute;
    top:-10px; left:50%;
    transform:translateX(-50%) rotate(-4deg);
    width:46px; height:18px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.7);
  }

  /* middle column: headline etc */
  .mid-col{ text-align:center; padding:0 8px; }
  .eyebrow-wrap{
    display:flex; justify-content:center; align-items:center; gap:14px;
    margin-bottom:2px;
  }
  .sparkle{ color:var(--green-600); font-size:20px; opacity:0.8; }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(30px, 4.4vh, 50px);
    color:var(--green-800);
    margin:0 0 8px;
    letter-spacing:-0.5px;
    text-shadow:0 2px 0 rgba(255,255,255,0.6);
  }
  h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(17px, 2.3vh, 25px);
    color:var(--green-700);
    margin:0 auto 3vh;
    line-height:1.32;
    max-width:460px;
  }
  h2 .underline{
    position:relative;
    display:inline-block;
  }
  h2 .underline::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-4px;
    height:9px;
    background:var(--green-100);
    border-radius:6px;
    z-index:-1;
  }

  .features{
    display:flex;
    justify-content:center;
    gap:3vw;
    margin-bottom:3vh;
    flex-wrap:wrap;
  }
  .feature{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:100px;
  }
  .feature .icon{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--green-50);
    border:2px dashed var(--green-500);
    display:flex; align-items:center; justify-content:center;
  }
  .feature .icon svg{ width:25px; height:25px; }
  .feature span{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--green-800);
    line-height:1.3;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:14px 30px;
    background:linear-gradient(135deg, var(--green-600), var(--green-800));
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:17px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    box-shadow:0 12px 22px rgba(28,110,46,0.32);
    transition:transform .18s ease, box-shadow .18s ease;
    text-decoration:none;
  }
  .cta:hover{ transform:translateY(-3px); box-shadow:0 16px 26px rgba(28,110,46,0.4); }
  .cta .arrow-circle{
    width:26px; height:26px;
    border-radius:50%;
    background:rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center;
  }

  /* food column */
  .food-col{
    display:flex;
    flex-direction:column;
    gap:1.6vh;
    align-items:flex-end;
    height:100%;
    justify-content:center;
  }
  .food-card{
    width:82%;
    max-width:300px;
    aspect-ratio:16/10;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 14px 26px rgba(28,60,20,0.16);
    transform:rotate(0deg);
  }
  .food-card img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .food-card:nth-child(1){ transform:rotate(1.5deg); }
  .food-card:nth-child(2){ transform:rotate(-1.2deg); width:90%; max-width:320px;}
  .food-card:nth-child(3){ transform:rotate(1deg); }

  /* responsive */
  @media (max-width:1080px){
    .content{ grid-template-columns:1fr; gap:50px; }
    .mascot-col{ order:2; }
    .mid-col{ order:1; }
    .food-col{ order:3; align-items:center; }
    .food-card{ width:70%; max-width:340px; }
    .veg{ display:none; }
    .hero{ padding:30px 24px 50px; }
  }
  @media (max-width:520px){
    .features{ gap:18px; }
    .feature{ width:86px; }
    .logo-text .tagline{ max-width:150px; font-size:12px;}
    .food-card{ width:92%; }
  }

  @media (prefers-reduced-motion:reduce){
    .mascot-col img{ animation:none; }
  }
</style>
</head>
<body>

<div class="hero">

  <span class="veg v7">

  </span>

  <div class="logo-row">
    <div class="logo-icon">

    <div class="logo-text">
      <div class="name">ReMeal</div>
      <div class="tagline">Biến đồ ăn có sẵn thành bữa ăn tuyệt vời</div>

  <div class="content">

    <div class="mascot-col">

      <span class="heart h2">♡</span>

      <a href="#" class="cta">

      <div class="food-card"><img src="https://github.com/k632414410088-byte/remeal/blob/main/m%C3%B3n%20%C4%83n%202.png?raw=true" alt="Món ăn 2"></div>

</div>
