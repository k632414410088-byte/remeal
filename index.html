<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReMeal - Có gì trong tủ?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #d9e8b8 0%, #e8f1d0 25%, #f5f9e8 50%, #eef6e0 75%, #e8f1cc 100%);
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            min-height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
        }

        /* Logo Section */
        .logo-section {
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 36px;
            font-weight: 900;
            color: #1b5e20;
            margin-bottom: 8px;
        }

        .logo-smile {
            width: 120px;
            height: 6px;
            background: linear-gradient(to right, transparent, #4caf50, transparent);
            border-radius: 3px;
        }

        .tagline {
            font-size: 13px;
            color: #4caf50;
            font-weight: 600;
            margin-top: 6px;
            line-height: 1.5;
            margin-left: 5px;
        }

        /* Main Hero */
        .hero-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            flex: 1;
            position: relative;
        }

        .hero-left {
            z-index: 10;
        }

        .headline {
            font-size: 5rem;
            font-weight: 900;
            color: #1b5e20;
            line-height: 1;
            margin-bottom: 25px;
            text-shadow: 0 8px 32px rgba(27, 94, 32, 0.15);
            letter-spacing: -0.02em;
        }

        .subheadline {
            font-size: 2rem;
            font-weight: 700;
            color: #1b5e20;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .underline-text {
            position: relative;
            padding-bottom: 12px;
        }

        .underline-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, #7ec850, #4caf50);
            border-radius: 3px;
        }

        /* Benefit Cards */
        .benefits {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .card-benefit {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(76, 175, 80, 0.2);
            border-radius: 24px;
            padding: 28px 18px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 24px rgba(27, 94, 32, 0.08);
        }

        .card-benefit:hover {
            transform: translateY(-12px);
            box-shadow: 0 16px 40px rgba(27, 94, 32, 0.15);
            border-color: rgba(76, 175, 80, 0.4);
            background: rgba(255, 255, 255, 0.95);
        }

        .card-icon {
            width: 64px;
            height: 64px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px;
        }

        .card-text {
            font-size: 13px;
            color: #1b5e20;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .card-decoration {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .card-line {
            width: 24px;
            height: 3px;
            background: #4caf50;
            border-radius: 2px;
        }

        .card-heart {
            color: #e91e63;
        }

        /* CTA Button */
        .btn-cta {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            padding: 18px 45px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 12px 32px rgba(76, 175, 80, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 14px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-cta:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(76, 175, 80, 0.4);
        }

        .btn-arrow {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4caf50;
            font-weight: 700;
            transition: transform 0.3s ease;
        }

        .btn-cta:hover .btn-arrow {
            transform: translateX(4px);
        }

        /* Right Side */
        .hero-right {
            position: relative;
            height: 100%;
        }

        /* Mascot */
        .mascot-section {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 300px;
            height: 360px;
        }

        .mascot-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 20px 40px rgba(27, 94, 32, 0.25));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        .mascot-logo {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-weight: 700;
            font-size: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .spoon {
            position: absolute;
            bottom: 80px;
            left: -30px;
            font-size: 48px;
            opacity: 0.9;
        }

        .veg-around-mascot {
            position: absolute;
            font-size: 32px;
            opacity: 0.75;
        }

        .veg1 { bottom: 140px; left: -50px; }
        .veg2 { bottom: 40px; left: -60px; }
        .veg3 { bottom: 20px; left: 10px; }

        .note {
            position: absolute;
            bottom: 20px;
            left: -100px;
            background: rgba(255, 250, 240, 0.85);
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transform: rotate(-2deg);
            border: 2px solid rgba(76, 175, 80, 0.1);
            font-family: 'Handlee', cursive;
            font-size: 12px;
            color: #4caf50;
            font-weight: 600;
            line-height: 1.6;
            text-align: center;
        }

        .note-heart {
            font-size: 10px;
            color: #e91e63;
            margin-top: 6px;
        }

        /* Food Bowls */
        .food-bowl {
            position: absolute;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }

        .bowl1 {
            width: 320px;
            height: 240px;
            top: 20px;
            right: 0px;
        }

        .bowl2 {
            width: 340px;
            height: 260px;
            top: 260px;
            right: -40px;
        }

        .bowl3 {
            width: 320px;
            height: 240px;
            top: 520px;
            right: 10px;
        }

        /* Decorations */
        .deco {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.7;
        }

        .deco-top-right1 { top: 40px; right: 450px; }
        .deco-top-right2 { top: 80px; right: 420px; }
        .deco-top-right3 { top: 50px; right: 380px; }

        .deco-bottom-left1 { bottom: 200px; left: 20px; }
        .deco-bottom-left2 { bottom: 80px; left: 180px; }
        .deco-bottom-left3 { bottom: 120px; left: 60px; }

        .heart-deco {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.5;
            color: #e91e63;
        }

        .heart1 { top: 80px; left: 120px; }
        .heart2 { top: 320px; left: 40px; }
        .heart3 { top: 400px; right: 200px; }
        .heart4 { bottom: 200px; right: 150px; }

        /* Responsive */
        @media (max-width: 1200px) {
            .container {
                padding: 30px 40px;
            }

            .hero-section {
                gap: 40px;
            }

            .headline {
                font-size: 3.5rem;
            }

            .subheadline {
                font-size: 1.5rem;
            }

            .bowl1, .bowl2, .bowl3 {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .hero-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .headline {
                font-size: 2.5rem;
            }

            .subheadline {
                font-size: 1.2rem;
            }

            .benefits {
                max-width: 100%;
            }

            .mascot-section {
                position: static;
                width: 200px;
                height: 240px;
                margin: 20px auto;
            }

            .spoon, .veg-around-mascot, .note {
                display: none;
            }

            .deco, .heart-deco, .bowl1, .bowl2, .bowl3 {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo-section">
            <div class="logo">
                <span>🍃</span>
                <span>ReMeal</span>
            </div>
            <div class="logo-smile"></div>
            <div class="tagline">
                Biến đồ ăn có sẵn<br>
                thành bữa ăn tuyệt vời
            </div>
        </div>

        <!-- Hero Section -->
        <div class="hero-section">
            <!-- Left Content -->
            <div class="hero-left">
                <h1 class="headline">Có gì<br>trong tủ?</h1>
                
                <p class="subheadline">
                    Hãy biến chúng thành<br>
                    <span class="underline-text">một bữa ăn phù hợp với bạn</span>
                </p>

                <!-- Benefit Cards -->
                <div class="benefits">
                    <div class="card-benefit">
                        <div class="card-icon">⏱️</div>
                        <div class="card-text">Tiết kiệm<br>thời gian</div>
                        <div class="card-decoration">
                            <div class="card-line"></div>
                            <div class="card-heart">♥</div>
                        </div>
                    </div>

                    <div class="card-benefit">
                        <div class="card-icon">🍃</div>
                        <div class="card-text">Giảm<br>lãng phí</div>
                        <div class="card-decoration">
                            <div class="card-line"></div>
                            <div class="card-heart">♥</div>
                        </div>
                    </div>

                    <div class="card-benefit">
                        <div class="card-icon">🥗</div>
                        <div class="card-text">Ăn uống<br>cân bằng</div>
                        <div class="card-decoration">
                            <div class="card-line"></div>
                            <div class="card-heart">♥</div>
                        </div>
                    </div>
                </div>

                <!-- CTA Button -->
                <button class="btn-cta">
                    <span>🍃 Tạo bữa ăn ngay</span>
                    <div class="btn-arrow">→</div>
                </button>
            </div>

            <!-- Right Content -->
            <div class="hero-right">
                <!-- Mascot -->
                <div class="mascot-section">
                    <svg class="mascot-svg" viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg">
                        <!-- Body -->
                        <ellipse cx="140" cy="180" rx="85" ry="105" fill="#7ec850"/>
                        <ellipse cx="140" cy="160" rx="75" ry="85" fill="#8fd65d" opacity="0.7"/>
                        
                        <!-- Face -->
                        <circle cx="140" cy="100" r="70" fill="#f5f5f5"/>
                        
                        <!-- Eyes -->
                        <circle cx="120" cy="90" r="12" fill="#000"/>
                        <circle cx="122" cy="88" r="4" fill="#fff"/>
                        <path d="M 155 105 Q 165 100 175 105" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        
                        <!-- Smile -->
                        <path d="M 120 125 Q 140 145 160 125" stroke="#e91e63" stroke-width="8" fill="none" stroke-linecap="round"/>
                        
                        <!-- Cheeks -->
                        <circle cx="95" cy="110" r="13" fill="#ffb3ba" opacity="0.7"/>
                        <circle cx="185" cy="110" r="13" fill="#ffb3ba" opacity="0.7"/>
                        
                        <!-- Leaves -->
                        <ellipse cx="105" cy="40" rx="16" ry="28" fill="#7ec850" transform="rotate(-35 105 40)"/>
                        <ellipse cx="175" cy="40" rx="16" ry="28" fill="#7ec850" transform="rotate(35 175 40)"/>
                        
                        <!-- Arms -->
                        <ellipse cx="55" cy="190" rx="22" ry="38" fill="#7ec850" transform="rotate(-40 55 190)"/>
                        <ellipse cx="225" cy="190" rx="22" ry="38" fill="#7ec850" transform="rotate(40 225 190)"/>
                        
                        <!-- Legs -->
                        <ellipse cx="110" cy="280" rx="18" ry="32" fill="#7ec850"/>
                        <ellipse cx="170" cy="280" rx="18" ry="32" fill="#7ec850"/>
                    </svg>
                    
                    <div class="mascot-logo">ReMeal</div>
                    <div class="spoon">🥄</div>
                    <div class="veg-around-mascot veg1">🥦</div>
                    <div class="veg-around-mascot veg2">🌶️</div>
                    <div class="veg-around-mascot veg3">🍅</div>

                    <div class="note">
                        Ăn ngon hơn<br>
                        Sống xanh hơn<br>
                        Mỗi ngày<br>
                        <div class="note-heart">♥</div>
                    </div>
                </div>

                <!-- Food Bowls -->
                <div class="food-bowl bowl1">🍤</div>
                <div class="food-bowl bowl2">🍚</div>
                <div class="food-bowl bowl3">🐟</div>
            </div>
        </div>
    </div>

    <!-- Decorations -->
    <div class="deco deco-top-right1">🥬</div>
    <div class="deco deco-top-right2">🍅</div>
    <div class="deco deco-top-right3">🧅</div>

    <div class="deco deco-bottom-left1">🥦</div>
    <div class="deco deco-bottom-left2">🍅</div>
    <div class="deco deco-bottom-left3">🌶️</div>

    <div class="heart-deco heart1">♥</div>
    <div class="heart-deco heart2">♥</div>
    <div class="heart-deco heart3">♥</div>
    <div class="heart-deco heart4">♥</div>

    <script>
        document.querySelector('.btn-cta').addEventListener('click', function() {
            alert('Tạo bữa ăn ngay!');
        });
    </script>
</body>
</html>
