<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReMeal - Có gì trong tủ?</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Handlee&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .bg-gradient-hero {
            background: linear-gradient(
                135deg,
                #d9e8b8 0%,
                #e8f1d0 25%,
                #f5f9e8 50%,
                #eef6e0 75%,
                #e8f1cc 100%
            );
            position: relative;
        }

        .bg-gradient-hero::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(217, 232, 184, 0.5) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
        }

        .bg-gradient-hero::after {
            content: '';
            position: absolute;
            bottom: -15%;
            right: -5%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(200, 220, 160, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(100px);
        }

        .headline-xl {
            font-size: 5.5rem;
            font-weight: 900;
            color: #1b5e20;
            line-height: 1;
            text-shadow: 0 8px 32px rgba(27, 94, 32, 0.15);
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.02em;
        }

        .headline-lg {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1b5e20;
            text-shadow: 0 4px 16px rgba(27, 94, 32, 0.1);
        }

        .text-hand {
            font-family: 'Handlee', cursive;
            color: #4caf50;
        }

        .card-benefit {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(76, 175, 80, 0.2);
            border-radius: 24px;
            padding: 28px 20px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 24px rgba(27, 94, 32, 0.08);
        }

        .card-benefit:hover {
            transform: translateY(-12px);
            box-shadow: 0 16px 40px rgba(27, 94, 32, 0.15);
            border-color: rgba(76, 175, 80, 0.4);
            background: rgba(255, 255, 255, 0.95);
        }

        .btn-cta {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            padding: 18px 50px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 12px 32px rgba(76, 175, 80, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .btn-cta:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(76, 175, 80, 0.4);
        }

        .btn-cta-arrow {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4caf50;
            font-weight: 700;
            transition: transform 0.3s ease;
        }

        .btn-cta:hover .btn-cta-arrow {
            transform: translateX(4px);
        }

        .mascot-container {
            position: relative;
            width: 280px;
            height: 320px;
        }

        .mascot-svg {
            filter: drop-shadow(0 20px 40px rgba(27, 94, 32, 0.25));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        .food-bowl {
            position: absolute;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
        }

        .food-bowl-1 {
            width: 320px;
            height: 240px;
            top: 40px;
            right: 20px;
        }

        .food-bowl-2 {
            width: 340px;
            height: 260px;
            top: 280px;
            right: 60px;
        }

        .food-bowl-3 {
            width: 320px;
            height: 240px;
            top: 550px;
            right: 30px;
        }

        .food-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: linear-gradient(135deg, #f0f0f0 0%, #e8e8e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .deco-veg {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.85;
            animation: float-slow 6s ease-in-out infinite;
        }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .heart-deco {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.6;
            color: #e91e63;
        }

        .underline-green {
            position: relative;
            display: inline-block;
        }

        .underline-green::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, #7ec850, #4caf50);
            border-radius: 2px;
        }

        .note-handwritten {
            background: rgba(255, 250, 240, 0.85);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transform: rotate(-2deg);
            border: 2px solid rgba(76, 175, 80, 0.1);
        }

        .logo-leaf {
            display: inline-block;
            margin-right: 8px;
        }

        .logo-smile {
            display: block;
            width: 120px;
            height: 8px;
            background: linear-gradient(to right, transparent, #4caf50, transparent);
            margin-top: 4px;
            border-radius: 4px;
        }

        @media (max-width: 1024px) {
            .headline-xl {
                font-size: 3.5rem;
            }

            .headline-lg {
                font-size: 1.5rem;
            }

            .food-bowl-1 {
                width: 280px;
                height: 210px;
                top: 60px;
            }

            .food-bowl-2 {
                width: 290px;
                height: 220px;
                top: 270px;
            }

            .food-bowl-3 {
                width: 280px;
                height: 210px;
                top: 500px;
            }
        }

        @media (max-width: 768px) {
            .headline-xl {
                font-size: 2.5rem;
            }

            .headline-lg {
                font-size: 1.2rem;
            }

            .card-benefit {
                padding: 20px 16px;
            }

            .food-bowl-1, .food-bowl-2, .food-bowl-3 {
                display: none;
            }
        }

        .leaf-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #7ec850 0%, #4caf50 100%);
            border-radius: 0 50% 50% 50%;
            transform: rotate(-45deg);
            position: relative;
        }

        .leaf-icon::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 12px;
            background: #2d5016;
            left: 50%;
            top: -8px;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function ReMealLanding() {
            return (
                <div className="bg-gradient-hero min-h-screen relative overflow-hidden">
                    {/* Decorative vegetables around edges */}
                    <div className="absolute top-12 right-20 text-4xl opacity-70">🥬</div>
                    <div className="absolute top-32 right-8 text-3xl opacity-60">🍅</div>
                    <div className="absolute top-20 right-40 text-2xl opacity-50">🧅</div>
                    
                    <div className="absolute bottom-32 left-8 text-4xl opacity-60">🥦</div>
                    <div className="absolute bottom-20 left-32 text-3xl opacity-70">🍅</div>
                    <div className="absolute bottom-40 left-16 text-2xl opacity-50">🌶️</div>
                    
                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 text-2xl opacity-40">🍃</div>

                    {/* Heart decorations */}
                    <div className="heart-deco top-24 left-32">♥</div>
                    <div className="heart-deco top-1/2 left-12">♥</div>
                    <div className="heart-deco top-1/3 right-1/3">♥</div>
                    <div className="heart-deco bottom-1/3 right-1/4">♥</div>

                    {/* Main container */}
                    <div className="relative z-10 h-screen flex flex-col">
                        {/* Top section - Logo and Hero */}
                        <div className="flex-1 flex flex-col px-8 pt-12 lg:pt-16">
                            {/* Logo Section */}
                            <div className="mb-12">
                                <div className="flex items-center gap-2">
                                    <span className="text-3xl">🍃</span>
                                    <h1 className="text-4xl font-black text-green-900" style={{letterSpacing: '-0.02em'}}>
                                        ReMeal
                                    </h1>
                                </div>
                                <div className="logo-smile"></div>
                                <p className="text-sm text-green-600 font-semibold mt-2 ml-1 leading-tight">
                                    Biến đồ ăn có sẵn<br/>
                                    thành bữa ăn tuyệt vời
                                </p>
                            </div>

                            {/* Hero section with two columns */}
                            <div className="flex-1 flex gap-16">
                                {/* Left - Text Content */}
                                <div className="flex-1 flex flex-col justify-center">
                                    <h2 className="headline-xl mb-6">
                                        Có gì<br/>trong tủ?
                                    </h2>

                                    <p className="headline-lg mb-12 leading-tight">
                                        Hãy biến chúng thành<br/>
                                        <span className="underline-green">một bữa ăn phù hợp với bạn</span>
                                    </p>

                                    {/* Benefit Cards */}
                                    <div className="grid grid-cols-3 gap-6 mb-8 max-w-2xl">

                                        <div className="card-benefit text-center">
                                            <div className="bg-green-100 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 text-3xl">
                                                ⏱️
                                            </div>
                                            <p className="text-green-900 font-bold text-sm leading-tight">
                                                Tiết kiệm<br/>thời gian
                                            </p>
                                            <div className="mt-4 flex justify-center items-center gap-1">
                                                <div className="w-8 h-0.5 bg-green-500 rounded"></div>
                                                <span className="text-red-400 text-xs">♥</span>
                                            </div>
                                        </div>

                                        {/* Card 2 */}
                                        <div className="card-benefit text-center">
                                            <div className="bg-green-100 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 text-3xl">
                                                🍃
                                            </div>
                                            <p className="text-green-900 font-bold text-sm leading-tight">
                                                Giảm<br/>lãng phí
                                            </p>
                                            <div className="mt-4 flex justify-center items-center gap-1">
                                                <div className="w-8 h-0.5 bg-green-500 rounded"></div>
                                                <span className="text-red-400 text-xs">♥</span>
                                            </div>
                                        </div>

                                        {/* Card 3 */}
                                        <div className="card-benefit text-center">
                                            <div className="bg-green-100 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 text-3xl">
                                                🥗
                                            </div>
                                            <p className="text-green-900 font-bold text-sm leading-tight">
                                                Ăn uống<br/>cân bằng
                                            </p>
                                            <div className="mt-4 flex justify-center items-center gap-1">
                                                <div className="w-8 h-0.5 bg-green-500 rounded"></div>
                                                <span className="text-red-400 text-xs">♥</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* CTA Button */}
                                    <button className="btn-cta w-fit" onClick={() => alert('Tạo bữa ăn ngay!')}>
                                        <span>🍃 Tạo bữa ăn ngay</span>
                                        <div className="btn-cta-arrow">→</div>
                                    </button>
                                </div>

                                {/* Right - Mascot and Food */}
                                <div className="flex-1 relative hidden lg:flex items-end justify-end pb-12">
                                    {/* Mascot */}
                                    <div className="absolute bottom-0 left-0">
                                        <svg className="mascot-svg" width="280" height="320" viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg">
                                            {/* Body */}
                                            <ellipse cx="140" cy="180" rx="85" ry="105" fill="#7ec850"/>
                                            <ellipse cx="140" cy="160" rx="75" ry="85" fill="#8fd65d" opacity="0.7"/>

                                            <circle cx="140" cy="100" r="70" fill="#f5f5f5"/>

                                            <circle cx="120" cy="90" r="12" fill="#000"/>

                                            <path d="M 155 105 Q 165 100 175 105" stroke="#000" strokeWidth="3" fill="none" strokeLinecap="round"/>

                                            <path d="M 120 125 Q 140 145 160 125" stroke="#e91e63" strokeWidth="8" fill="none" strokeLinecap="round"/>

                                            <circle cx="95" cy="110" r="13" fill="#ffb3ba" opacity="0.7"/>
                                            <circle cx="185" cy="110" r="13" fill="#ffb3ba" opacity="0.7"/>
                                            
                                            {/* Leaves on head */}
                                            <ellipse cx="105" cy="40" rx="16" ry="28" fill="#7ec850" transform="rotate(-35 105 40)"/>

                                            {/* Arms */}
                                            <ellipse cx="55" cy="190" rx="22" ry="38" fill="#7ec850" transform="rotate(-40 55 190)"/>
                                            <ellipse cx="225" cy="190" rx="22" ry="38" fill="#7ec850" transform="rotate(40 225 190)"/>
                                            
                                            {/* Legs */}
                                            <ellipse cx="110" cy="280" rx="18" ry="32" fill="#7ec850"/>
                                            <ellipse cx="170" cy="280" rx="18" ry="32" fill="#7ec850"/>
                                        </svg>

                                        {/* Logo on body */}
                                        <div className="absolute bottom-12 left-1/2 transform -translate-x-1/2 text-white font-bold text-sm text-center" style={{textShadow: '0 2px 4px rgba(0,0,0,0.2)'}}>

                                        </div>

                                        {/* Spoon */}
                                        <div className="absolute bottom-20 -left-8 text-4xl opacity-80">🥄</div>
                                    </div>

                                    {/* Vegetables around mascot */}
                                    <div className="absolute bottom-32 -left-8 text-3xl opacity-75 animate-bounce" style={{animationDelay: '0.2s'}}>🥦</div>
                                    <div className="absolute bottom-16 -left-12 text-2xl opacity-60">🌶️</div>
                                    <div className="absolute bottom-8 left-8 text-3xl opacity-70">🍅</div>

                                    {/* Handwritten note */}
                                    <div className="note-handwritten absolute bottom-8 -left-20">
                                        <p className="text-hand text-green-600 font-semibold text-sm leading-tight text-center">
                                            Ăn ngon hơn<br/>
                                            Sống xanh hơn<br/>
                                            Mỗi ngày
                                        </p>
                                        <div className="text-center mt-2 text-red-400">♥</div>
                                    </div>

                                    {/* Food Bowls */}
                                    <div className="food-bowl food-bowl-1">
                                        <div className="food-image text-5xl">🍤</div>
                                    </div>
                                    <div className="food-bowl food-bowl-2">
                                        <div className="food-image text-5xl">🍚</div>
                                    </div>
                                    <div className="food-bowl food-bowl-3">
                                        <div className="food-image text-5xl">🐟</div>
                                    </div>

                                    {/* Green napkin decoration */}
                                    <div className="absolute" style={{top: '70px', right: '310px'}} className="text-2xl opacity-60">🟩</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ReMealLanding />, document.getElementById('root'));
    </script>
</body>
</html>
